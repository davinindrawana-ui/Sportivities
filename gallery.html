        .navbar {

        .nav-link {
            color: white;

            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #ffd700;
        }

        /* Arrow styling */
        .dropdown-arrow {
            border: solid white;
            border-width: 0 3px 3px 0;
            padding: 3px;
            transform: rotate(45deg);
            transition: transform 0.3s ease;
            width: 12px;
            height: 12px;
        }

        .nav-item:hover .dropdown-arrow {
            transform: rotate(-135deg);
        }

        /* Dropdown Menu */
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: white;
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            border-radius: 8px;
            overflow: hidden;
        }

        .nav-item:hover .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-link {
            color: #333;
            padding: 1rem 1.5rem;
            text-decoration: none;
            display: block;
            transition: background-color 0.3s ease;
        }

        .dropdown-link:hover {
            background-color: #f1f1f1;
            color: #333;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-menu {
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: #333;
                gap: 0;
            }

            .nav-item {
                width: 100%;
            }

            .dropdown {
                position: static;
                box-shadow: none;
                background-color: #444;
            }

            .nav-item:hover .dropdown {
                opacity: 1;
                visibility: visible;
                transform: none;

<script>
const music = document.getElementById("bgMusic");
const btn = document.getElementById("playPause");
const cover = document.getElementById("musicToggle");

let isPlaying = false;

function toggleMusic() {
    if (!isPlaying) {
        music.play();
        btn.textContent = "⏸";
        cover.classList.add("playing");
    } else {
        music.pause();
        btn.textContent = "▶";
        cover.classList.remove("playing");
    }
    isPlaying = !isPlaying;
}

// klik cover atau tombol
btn.addEventListener("click", toggleMusic);
cover.addEventListener("click", toggleMusic);

// volume biar halus
music.volume = 0.3;
</script>
<script>

var swiper = new Swiper(".mySwiper", {
    effect: "coverflow",
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: "auto",
    loop: true,

    coverflowEffect: {
        rotate: 0,
        stretch: 0,
        depth: 120,
        modifier: 2.5,
        slideShadows: false,
    },

    pagination: {
        el: ".swiper-pagination",
        clickable: true,
    },

    autoplay: {
        delay: 2500,
        disableOnInteraction: false,
    },

    on: {
        slideChange: function () {
            updateBackground();
        }
    }
});

function updateBackground() {
    let activeSlide = document.querySelector(".swiper-slide-active img");
    let bgBody = document.getElementById("bg-body");

    if (activeSlide) {
        let imgSrc = activeSlide.getAttribute("src");

        bgBody.style.background = `
            linear-gradient(rgba(15,23,42,0.7), rgba(30,41,59,0.7)),
            url(${imgSrc}) center/cover no-repeat
        `;
    }
}

// Run once on load
updateBackground();

</script>
